name: chat_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  font_awesome_flutter: 11.0.0
  supabase_flutter: ^2.17.2
  flutter_dotenv: ^6.0.1
  app_links: ^7.2.1
  intl: ^0.20.3
  uuid: ^4.6.0
  image_picker: ^1.2.3
  record: ^7.1.1
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  circle_nav_bar: ^2.2.0
  file_picker: ^12.3.0
  geolocator: ^14.1.1
  url_launcher: ^6.3.2
  open_file: ^4.0.0
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.7
  enough_giphy_flutter: ^0.4.2
  firebase_messaging: ^16.4.1
  firebase_core: ^4.11.0
  flutter_local_notifications: ^22.0.1
  flutter_webrtc: ^1.6.2+hotfix.4
  flutter_callkit_incoming: 2.5.8
  local_auth: ^3.0.2
  chat_bubbles: ^1.10.1
  get: ^4.7.3
  get_storage: ^2.1.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icon/

flutter_native_splash:
  color: "#075E54"
  image: assets/icon/app_logo.png
  android_12:
    color: "#075E54"
    image: assets/icon/app_logo.png